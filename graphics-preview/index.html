<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081422">
  <meta name="robots" content="noindex">
  <title>MOONKATTY — лунная база 3D</title>
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="world.css?v=20261010-world-1">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body>
  <main id="world" aria-label="Лунная база MOONKATTY">
    <canvas id="scene" tabindex="0" aria-label="3D-мир. WASD или стрелки — ходьба; перетаскивание — камера; Q и E — поворот; Escape — пауза."></canvas>
    <header class="hud-head">
      <div class="brand"><svg viewBox="0 0 48 34" aria-hidden="true"><path d="M3 30V5l21 20L45 5v25M3 5l21 20L45 5M13 3l11 11L35 3"/></svg><span>MOONKATTY<small>ЛУННАЯ БАЗА / 3D-ПОЛИГОН</small></span></div>
      <button id="pause" class="round pause" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg></button>
      <h1>ПЕРИМЕТР БАЗЫ</h1>
      <div class="objective"><span class="spark">ϟ</span><span>ИССЛЕДУЙТЕ МОДУЛИ</span><b id="progress">0 / 3</b></div>
      <p id="hint">Ходите джойстиком · поворачивайте мир пальцем</p>
    </header>
    <div id="station-labels" aria-hidden="true"></div>
    <p id="notice" role="status" aria-live="polite"></p>
    <div class="controls">
      <div id="joystick" role="group" aria-label="Джойстик движения">
        <span class="direction north">⌃</span><span class="direction east">›</span><span class="direction south">⌄</span><span class="direction west">‹</span>
        <span id="stick"></span>
        <button class="move-hit up" data-move="up" aria-label="Вперёд"></button>
        <button class="move-hit down" data-move="down" aria-label="Назад"></button>
        <button class="move-hit left" data-move="left" aria-label="Влево"></button>
        <button class="move-hit right" data-move="right" aria-label="Вправо"></button>
      </div>
      <button id="inspect" class="action" disabled><span class="action-orb"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M15 8h10M20 8v7m-8 0h16v13H12zm3 18h10M16 20h8M16 24h5"/></svg></span><span id="inspect-text">ПОДОЙДИТЕ</span></button>
      <button id="scan" class="action cyan"><span class="action-orb radar"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13"/><circle cx="20" cy="20" r="7"/><path d="M20 20 30 8"/><circle cx="20" cy="20" r="1.5"/></svg></span><span>СКАН</span></button>
    </div>
    <nav class="bottom-nav" aria-label="Инструменты исследования">
      <button id="map"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m3 7 7-3 8 3 7-3v18l-7 3-8-3-7 3zm7-3v18m8-15v18"/></svg><span>КАРТА</span></button>
      <button id="camera-reset" class="selected" aria-label="Вернуть камеру за кота"><svg viewBox="0 0 30 30" aria-hidden="true"><ellipse cx="15" cy="21" rx="8" ry="6"/><ellipse cx="5" cy="12" rx="3" ry="4"/><ellipse cx="12" cy="7" rx="3" ry="4"/><ellipse cx="20" cy="7" rx="3" ry="4"/><ellipse cx="26" cy="13" rx="3" ry="4"/></svg><span>МОЙ КОТ</span></button>
      <button id="tasks"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="5" y="3" width="18" height="23" rx="3"/><path d="M10 9h8M10 14h8M10 19h5"/></svg><span>ЗАДАЧИ</span></button>
    </nav>
    <dialog id="panel" aria-labelledby="panel-title">
      <div class="panel-copy"><span class="eyebrow">MOONKATTY / LUNAR CREW</span><h2 id="panel-title">ПАУЗА</h2><div id="panel-content"></div></div>
      <div class="panel-actions"><button id="resume" class="primary">ПРОДОЛЖИТЬ</button><button id="quality">КАЧЕСТВО: АВТО</button><a href="../">В ОСНОВНУЮ ИГРУ</a></div>
    </dialog>
    <div id="loading" role="status"><div class="loader-mark">M</div><h2>ЛУННАЯ БАЗА</h2><p id="load-status">Подготовка 3D-мира…</p><a id="fallback" href="../" hidden>Вернуться в основную игру</a></div>
  </main>
  <script type="module" src="world.js?v=20261010-world-1"></script>
</body>
</html>
