<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>MOONKATTY · Admin review</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="creator.css?v=20261007-creator-1">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;background:#071017;color:#e6f0f5;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:18px;font-weight:500;margin:4px 0 2px;letter-spacing:.5px}
.ad-sub{font-size:12px;color:#8fa6b2;margin:0 0 12px}
.ad-tabs{display:flex;gap:6px;margin:10px 0}
.ad-tabs button{flex:1;min-height:40px;border:1px solid #ffffff2a;border-radius:4px;background:#0b1822;color:#cbdce5;font:inherit;font-size:12px;cursor:pointer}
.ad-tabs button[aria-pressed=true]{background:#dec898;color:#14242d;border-color:#dec898}
.ad-card{padding:12px;border:1px solid #ffffff1f;border-radius:6px;background:#0b1822aa;margin:8px 0}
.ad-card a{color:#f3e2b5;word-break:break-all;font-size:13px}
.ad-meta{font-size:11px;color:#8fa6b2;margin:4px 0}
.ad-cap{font-size:12px;color:#cbdce5;background:#06101699;border-radius:4px;padding:8px;margin:6px 0;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto}
.ad-act{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ad-act button{min-height:42px;border-radius:4px;border:1px solid #ffffff2a;background:#152c3a;color:#e6f0f5;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ad-act .ok{background:#2f7d58;border-color:#3fae7a}.ad-act .no{background:#7a2e2e;border-color:#c45050}
.ad-act button:disabled{opacity:.45;cursor:default}
.ad-box{padding:14px;border:1px dashed #e2ce9b66;border-radius:6px;color:#f3e2b5;font-size:13px}
.ad-box code{background:#ffffff14;padding:2px 6px;border-radius:3px;user-select:all}
#adMsg{min-height:1.2em;font-size:12px;color:#f3e2b5;text-align:center}
</style>
</head>
<body>
<main>
 <h1>🎬 <span data-t="Creator review">Creator review</span></h1>
 <p class="ad-sub" data-t="Approve or reject player videos. Points are awarded by the server.">Approve or reject player videos. Points are awarded by the server.</p>
 <div id="adBody"></div>
 <p id="adMsg" role="status"></p>
 <p><a href="./" style="color:#8fa6b2;font-size:12px" data-t="← Back to the game">← Back to the game</a></p>
</main>
<script src="locales/creator.js?v=20261007-creator-1"></script>
<script src="locales/social.js?v=20261007-social-1"></script>
<script>
(()=>{
 'use strict';
 // No secrets here: every action is authorised server-side (Telegram initData signature + ADMIN_TG_IDS).
 const ENDPOINT='https://lswbmgoeinblzuqzakvi.supabase.co/functions/v1/rewards';
 const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();}catch{}
 const lang=(localStorage.getItem('mkty_lang')||tg?.initDataUnsafe?.user?.language_code||'en').slice(0,2);
 const pack=(window.MKTYLocales?.[lang]?.strings)||{};
 const t=en=>pack[en]??en;
 document.documentElement.lang=lang;if(lang==='he')document.documentElement.dir='rtl';
 document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const $=id=>document.getElementById(id),body=$('adBody'),msg=$('adMsg');
 const initData=tg?.initData||'',me=tg?.initDataUnsafe?.user?.id;
 let status='pending',points={base:250,tier_1k:250,tier_10k:500},mode=new URLSearchParams(location.search).get('tab')==='social'?'social':'video',spoints={};
 async function call(action,payload={}){
  try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,action,...payload}),signal:AbortSignal.timeout(10000)});return await r.json().catch(()=>({ok:false,error:'unavailable'}));}catch{return {ok:false,error:'unavailable'};}
 }
 const idBox=()=>me?`<p>${t('Your Telegram ID')}: <code>${esc(me)}</code></p>`:'';
 function denied(err){
  body.innerHTML=`<div class="ad-box">${err==='telegram'?t('Open this page from the MOONKATTY bot in Telegram.'):t('Access denied. This page is only for MOONKATTY admins.')}${idBox()}${err==='forbidden'?`<p>${t('To get access, send this ID to the project owner; it must be added to the ADMIN_TG_IDS server secret.')}</p>`:''}</div>`;
 }
 function card(s){
  const who=s.username?'@'+s.username:(s.first_name||'');
  const date=new Date(s.created_at).toLocaleString(lang);
  let act='';
  if(s.status==='pending')act=`<button class="ok" data-review="approve" data-id="${s.id}">${t('APPROVE')} +${points.base} ⭐</button><button class="no" data-review="reject" data-id="${s.id}">${t('REJECT')}</button>`;
  else if(s.status==='approved')act=`<button data-tier="1k" data-id="${s.id}" ${s.tier_1k?'disabled':''}>${s.tier_1k?'✓ ':''}${t('1,000+ views')} +${points.tier_1k} ⭐</button><button data-tier="10k" data-id="${s.id}" ${s.tier_10k?'disabled':''}>${s.tier_10k?'✓ ':''}${t('10,000+ views')} +${points.tier_10k} ⭐</button>`;
  return `<article class="ad-card"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.platform.toUpperCase())} · ${esc(s.url)}</a><div class="ad-meta">#${s.id} · ${esc(who)} · ID ${esc(s.telegram_id)} · ${esc(date)}${s.points?` · +${s.points} ⭐`:''}</div><div class="ad-cap">${esc(s.caption)}</div>${act?`<div class="ad-act">${act}</div>`:''}</article>`;
 }
 function scard(s){
  const who=s.username?'@'+s.username:(s.first_name||'');
  const pts=spoints[s.platform+'_'+s.kind]||0;
  const kind=s.kind==='follow'?t('Follow'):(s.platform==='x'?t('Post / reply with code'):t('Comment with code'));
  const link=/^https:/.test(s.proof)?`<a href="${esc(s.proof)}" target="_blank" rel="noopener noreferrer">${esc(s.proof)}</a>`:`<a href="${s.platform==='x'?'https://x.com/':'https://www.tiktok.com/@'}${esc(s.proof.replace(/^@/,''))}" target="_blank" rel="noopener noreferrer">${esc(s.proof)}</a>`;
  const act=s.status==='pending'?`<div class="ad-act"><button class="ok" data-sreview="approve" data-id="${s.id}">${t('APPROVE')} +${pts} ⭐</button><button class="no" data-sreview="reject" data-id="${s.id}">${t('REJECT')}</button></div>`:'';
  return `<article class="ad-card"><div class="ad-meta">${esc(s.platform==='x'?'X':'TIKTOK')} · ${esc(kind)} · #${s.id}</div>${link}<div class="ad-cap">${t('Code')}: <b translate="no">${esc(s.code)}</b> · ${esc(s.day)}</div><div class="ad-meta">${esc(who)} · ID ${esc(s.telegram_id)} · ${esc(new Date(s.created_at).toLocaleString(lang))}${s.points?` · +${s.points} ⭐`:''}</div>${act}</article>`;
 }
 async function load(){
  if(!initData){denied('telegram');return;}
  msg.textContent=t('Loading…');
  const r=await call(mode==='social'?'admin.social.list':'admin.creator.list',{status});
  if(!r.ok){msg.textContent='';denied(r.error);return;}
  if(mode==='social')spoints=r.points||spoints;else points=r.points||points;msg.textContent='';
  const modes=`<div class="ad-tabs ad-modes">${[['video','🎬 '+t('Videos')],['social','📣 '+t('Social')]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${k===mode}">${l}</button>`).join('')}</div>`;
  const help=mode==='social'?`<p class="ad-sub">${t('Check that the post / comment / follower contains the player code, then approve. Points are paid once by the server.')}</p>`:'';
  body.innerHTML=modes+help+`<div class="ad-tabs">${[['pending','ON REVIEW'],['approved','APPROVED'],['rejected','REJECTED']].map(([k,l])=>`<button data-tab="${k}" aria-pressed="${k===status}">${t(l)}</button>`).join('')}</div>${r.submissions.length?r.submissions.map(mode==='social'?scard:card).join(''):`<p class="cr-empty">${t('No submissions yet.')}</p>`}`;
 }
 body.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.tab){status=b.dataset.tab;load();return;}
  if(b.dataset.mode){mode=b.dataset.mode;status='pending';load();return;}
  if(b.dataset.sreview){if(!confirm(b.dataset.sreview==='reject'?t('Reject this submission?'):t('Award points for this submission?')))return;b.disabled=true;const r=await call('admin.social.review',{id:Number(b.dataset.id),decision:b.dataset.sreview});await load();msg.textContent=r.ok?(r.reward?.points?`+${r.reward.points} ⭐ ✓`:t('Saved.')):t('Error')+': '+(r.error||'');return;}
  const id=Number(b.dataset.id);
  const action=b.dataset.review?'admin.creator.review':'admin.creator.tier';
  const q=b.dataset.review==='reject'?t('Reject this video?'):t('Award points for this video?');
  if(!confirm(q))return;
  b.disabled=true;
  const r=await call(action,b.dataset.review?{id,decision:b.dataset.review}:{id,tier:b.dataset.tier});
  msg.textContent=r.ok?(r.reward?.points?`+${r.reward.points} ⭐ ✓`:t('Saved.')):t('Error')+': '+(r.error||'');
  load();
 });
 load();
})();
</script>
</body>
</html>
