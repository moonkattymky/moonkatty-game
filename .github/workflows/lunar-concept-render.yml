name: Render isolated authored lunar assets
on:
  push:
    branches: ['visual/lunar-concept-20261010']
    paths: ['lunar-slice/**', '.github/workflows/lunar-concept-render.yml']
permissions:
  contents: read
concurrency:
  group: lunar-concept-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check authored asset loader and model study
        run: node --check lunar-slice/authored.js && node --check lunar-slice/module.js && node --check lunar-slice/tests/module-render.cjs
      - name: Render the actual authored asset from three cameras
        run: timeout 360s node lunar-slice/tests/module-render.cjs
      - name: Preserve real asset evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-module-${{ github.sha }}
          path: /tmp/moonkatty-authored-module
          retention-days: 7
          if-no-files-found: error
