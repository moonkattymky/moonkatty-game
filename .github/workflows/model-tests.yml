# Copy to .github/workflows/model-tests.yml when a token with `workflow` scope is available.
name: Model tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: story-plan
        run: node tests/story-plan.cjs
      - name: mission-rules
        run: node tests/mission-rules.cjs
      - name: expedition-model
        run: node tests/expedition-model.cjs
      - name: field-rules
        run: node tests/field-rules.cjs
      - name: detail-rules
        run: node tests/detail-rules.cjs
      - name: referrals-server
        run: node tests/referrals-server.cjs
      - name: rewards-server
        run: node tests/rewards-server.cjs
      - name: leaderboard-server
        run: node tests/leaderboard-server.cjs
      - name: daily-server
        run: node tests/daily-server.cjs
      - name: creator-server
        run: node tests/creator-server.cjs
