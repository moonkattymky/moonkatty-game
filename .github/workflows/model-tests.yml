name: Full game tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Full-target mission control reachability regression
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-mission-guidance-preflight
        run: node tests/mission-guidance-ui.cjs
      - name: Native triangulation keyboard and touch regression
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-triangulation-keyboard-ui-preflight
        run: node tests/triangulation-keyboard-ui.cjs
      - name: Native immediate language refresh regression
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-language-hot-switch-ui-preflight
        run: node tests/language-hot-switch-ui.cjs
      - name: Native antenna touchscreen regression
        env:
          MKTY_TEST_OUTPUT: /tmp/moonkatty-antenna-native
        run: node tests/antenna-native-touch.cjs
      - name: Preserve native antenna diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-antenna-touch
          path: /tmp/moonkatty-antenna-native
          if-no-files-found: ignore
          retention-days: 7
      - name: Native chapter range touchscreen regression
        env:
          MKTY_TEST_OUTPUT: /tmp/moonkatty-ranges-native
        run: node tests/native-range-touch.cjs
      - name: Preserve native chapter range diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-chapter-ranges
          path: /tmp/moonkatty-ranges-native
          if-no-files-found: ignore
          retention-days: 7
      - name: Native legacy range touchscreen regression
        env:
          MKTY_TEST_OUTPUT: /tmp/moonkatty-legacy-ranges-native
        run: node tests/legacy-range-native-touch.cjs
      - name: Preserve native legacy range diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-legacy-ranges
          path: /tmp/moonkatty-legacy-ranges-native
          if-no-files-found: ignore
          retention-days: 7
      - name: Native localized guidance regression
        env:
          MKTY_TEST_OUTPUT: /tmp/moonkatty-guidance-preflight
        run: node tests/guidance-locales-ui.cjs
      - name: Preserve localized guidance preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localized-guidance-preflight
          path: /tmp/moonkatty-guidance-preflight
          if-no-files-found: ignore
          retention-days: 7
      - name: Every model, browser, campaign and security regression
        run: npm test
      - name: Preserve localized guidance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localized-guidance-views
          path: /tmp/mkty-guidance-locales-ui-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve gated intro navigation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gated-intro-navigation
          path: /tmp/mkty-locked-intro-browser-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve language switch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-hot-switch
          path: /tmp/mkty-language-hot-switch-ui-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve life restoration copy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-restoration-copy
          path: /tmp/mkty-life-restore-copy-ui-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve triangulation input diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triangulation-keyboard
          path: /tmp/mkty-triangulation-keyboard-ui-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve full-target mission guidance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-guidance
          path: |
            /tmp/mkty-mission-guidance-preflight/
            /tmp/mkty-guidance-*/
          if-no-files-found: ignore
          retention-days: 7
