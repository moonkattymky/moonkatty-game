name: Full game tests
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Every model, browser, campaign and security regression
        run: npm test
      - name: Embedded 3D entry browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-entry-${{ github.sha }}
          path: /tmp/mkty-preview-entry-ui-*/
          if-no-files-found: ignore
          retention-days: 7
