name: IndexedDB evidence adapter tests
on:
  pull_request:
    paths:
      - 'prototypes/evidence-indexeddb/**'
      - 'tests/evidence-indexeddb*.cjs'
      - 'tests/fixtures/evidence-indexeddb/**'
      - 'tests/evidence-unsaved-result*.cjs'
      - 'tests/fixtures/evidence-unsaved-result/**'
      - 'tests/evidence-finale-*.cjs'
      - 'tests/evidence-read-abort.cjs'
      - 'tests/evidence-context-stream.cjs'
      - 'tests/evidence-phase*.cjs'
      - 'tests/evidence-physical-idle.cjs'
      - 'tests/evidence-precision-observation.cjs'
      - 'tests/evidence-retired-witness.cjs'
      - 'tests/evidence-story-rewrite.cjs'
      - 'tests/fixtures/evidence-phase-session/**'
      - 'tests/fixtures/evidence-finale-controller/**'
      - '.github/workflows/evidence-indexeddb-tests.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-evidence-indexeddb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify existing pinned Playwright version
        run: node -e "require('node:assert/strict').equal(require('playwright/package.json').version, '1.58.2')"
      - run: npx playwright install --with-deps chromium
      - name: Portable frozen vectors and source contract
        run: node tests/evidence-indexeddb.cjs
      - name: Synthetic unsaved-result state contract
        run: node tests/evidence-unsaved-result.cjs
      - name: Fixed raw-finale admission and shared ownership
        run: node tests/evidence-finale-completion.cjs
      - name: Read-only abort classification and sealed read retry
        run: node tests/evidence-read-abort.cjs
      - name: Native synthetic-origin IndexedDB groups A-I
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-evidence-indexeddb-native
        run: node tests/evidence-indexeddb-ui.cjs
      - name: Native synthetic result retry and localized test UI
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-evidence-unsaved-result-native
        run: node tests/evidence-unsaved-result-ui.cjs
      - name: Original spatial finale handlers and local recovery
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-evidence-finale-controller-native
        run: node tests/evidence-finale-controller-ui.cjs
      - name: Preserve qualified native evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-indexeddb-native
          path: /tmp/mkty-evidence-indexeddb-native/native-indexeddb-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve synthetic result-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-unsaved-result-native
          path: /tmp/mkty-evidence-unsaved-result-native/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve original-controller integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-finale-controller-native
          path: /tmp/mkty-evidence-finale-controller-native/
          if-no-files-found: ignore
          retention-days: 14

  native-phase-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify existing pinned Playwright version
        run: node -e "require('node:assert/strict').equal(require('playwright/package.json').version, '1.58.2')"
      - run: npx playwright install --with-deps chromium
      - name: Fixed continuous phase ownership and exact writer contract
        run: |
          node tests/evidence-context-stream.cjs
          node tests/evidence-phase-v2.cjs
          node tests/evidence-phase-session.cjs
          node tests/evidence-phase-writer.cjs
          node tests/evidence-precision-observation.cjs
          node tests/evidence-phase-input-fence.cjs
      - name: Continuous native guest finale sequence
        env:
          MKTY_TEST_OUTPUT: /tmp/mkty-evidence-phase-session-native
        run: node tests/evidence-phase-session-ui.cjs
      - name: Preserve continuous native evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-phase-session-native
          path: /tmp/mkty-evidence-phase-session-native/
          if-no-files-found: error
          retention-days: 14
