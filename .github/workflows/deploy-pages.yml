name: Deploy MOONKATTY to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/model-tests.yml
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare client site
        run: |
          mkdir -p _site
          shopt -s dotglob nullglob
          for item in *; do
            case "$item" in
              _site|admin.html|server|supabase|tests|tools|docs|node_modules|package.json|package-lock.json|.git|.github|.gitignore|README.md) continue ;;
            esac
            cp -a "$item" _site/
          done
      - name: Stamp verified artifact
        run: node tools/stamp-release.cjs _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published files and API
        run: node tools/verify-live.cjs
