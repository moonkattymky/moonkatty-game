<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Synthetic unsaved-result gate fixture</title>
<link rel="stylesheet" href="/fixture/fixture.css">
<script src="/fixture/native-harness.js"></script>
<script type="module" src="/fixture/fixture.mjs"></script>
</head>
<body>
<main>
<p id="test-only"></p>
<label for="language" id="language-label"></label>
<select id="language"></select>
<h1 id="title"></h1>
<section aria-labelledby="status" aria-describedby="warning">
<h2 id="status" role="status" aria-live="polite"></h2>
<p id="warning" role="note"></p>
<p id="reason" lang="en" dir="ltr" translate="no"></p>
<div class="actions">
<button id="retry" type="button" disabled aria-describedby="warning"></button>
<button id="continue" type="button" disabled aria-describedby="warning"></button>
</div>
</section>
<section aria-labelledby="summary-label">
<h2 id="summary-label"></h2>
<pre id="summary" lang="en" dir="ltr" translate="no"></pre>
</section>
</main>
</body>
</html>
