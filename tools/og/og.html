html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#fff}
body{background:radial-gradient(circle at 78% 40%,rgba(124,77,255,.55),transparent 45%),radial-gradient(circle at 15% 90%,rgba(255,196,64,.25),transparent 40%),linear-gradient(135deg,#05070d,#141a33 60%,#0a0e1f)}

.txt{position:absolute;left:70px;top:90px;width:560px}
.eyebrow{letter-spacing:.35em;color:#ffd666;font-weight:700;font-size:24px}
h1{font-size:96px;line-height:.95;margin:18px 0 10px;font-weight:900;text-shadow:0 0 30px rgba(124,77,255,.8)}
